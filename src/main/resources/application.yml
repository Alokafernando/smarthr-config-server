server:
  port: 8888

spring:
  application:
    name: config-server

  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          search-locations:
            - classpath:/config-repo
            - classpath:/config-repo/platform
            - classpath:/config-repo/servers

        git:
          uri: https://github.com/Alokafernando/smathr-configurations.git
          default-label: main
          clone-on-start: true
          search-paths:
            - platform
            - servers

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info